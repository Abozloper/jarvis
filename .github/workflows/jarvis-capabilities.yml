name: Jarvis capability checks
on:
  push:
    branches: [main]
    paths: ['jervis-pilot/*.py', '.github/workflows/jarvis-capabilities.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capabilities:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install requests pypdf==7.0.1
      - name: Check syntax and capabilities
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PYTHONPATH = (Resolve-Path jervis-pilot).Path
          python -m compileall -q jervis-pilot
          python jervis-pilot/check_pilot.py
          python jervis-pilot/check_knowledge.py
