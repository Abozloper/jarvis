name: Hindsight Windows compatibility
on:
  push:
    paths: ['jervis-pilot/hindsight-probe.txt']
  workflow_dispatch:
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install native Hindsight dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install "hindsight-api-slim[local-onnx,embedded-db]==1.2.1" flashrank hindsight-client requests
          python -c "import hindsight_api; import pg0; print('Native Hindsight imports passed')"
      - name: Start local model for Hindsight
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://github.com/ollama/ollama/releases/download/v0.34.4/ollama-windows-amd64.zip' -OutFile ollama.zip
          Expand-Archive ollama.zip -DestinationPath ollama
          $env:OLLAMA_HOST = '127.0.0.1:11535'
          $env:OLLAMA_NO_CLOUD = '1'
          Start-Process -FilePath "$pwd/ollama/ollama.exe" -ArgumentList 'serve' -WindowStyle Hidden
          Start-Sleep -Seconds 5
          & ./ollama/ollama.exe pull qwen2.5:1.5b
          if ($LASTEXITCODE -ne 0) { throw 'Local model setup failed' }
      - name: Start native service and verify database
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
          HINDSIGHT_API_LLM_PROVIDER: ollama
          HINDSIGHT_API_LLM_BASE_URL: http://127.0.0.1:11535
          HINDSIGHT_API_LLM_MODEL: qwen2.5:1.5b
          HINDSIGHT_API_EMBEDDINGS_PROVIDER: onnx
          HINDSIGHT_API_RERANKER_PROVIDER: flashrank
        run: |
          python jervis-pilot/check_hindsight.py
