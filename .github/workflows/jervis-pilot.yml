name: Jervis Windows pilot
on:
  push:
    branches: [main]
    paths: ['jervis-pilot/build-ready.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Prepare Jervis v1.0.5
        shell: pwsh
        run: |
          git clone --depth 1 --branch v1.0.5 https://github.com/TheJarvis-App/jarvis-app.git upstream
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item jervis-pilot/jarvis_pilot.py upstream/
          python jervis-pilot/apply_patch.py upstream
          node --check upstream/backend.js
          node --check upstream/renderer.js
          python -m py_compile upstream/app.py
      - name: Build Windows installer
        working-directory: upstream
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          JERVIS_AUDIO: 'off'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -r requirements.txt -r requirements-dev.txt pyinstaller
          python -m pytest -q
          pyinstaller --noconfirm --distpath backend-dist --workpath build/pyinstaller jervis-backend.spec
          npm ci
          npx electron-builder --win --publish never
          ./tests/installer/windows_smoke.ps1 -Installer 'release/Jervis Setup.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: Jervis-Windows-Pilot
          path: upstream/release/Jervis Setup.exe
          if-no-files-found: error
      - name: Publish Jarvis Windows update
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd upstream/release
          mv 'Jervis Setup.exe' Jarvis-Windows-Setup.exe
          sha256sum Jarvis-Windows-Setup.exe > SHA256SUMS.txt
          gh release create jarvis-windows-pilot-v2 Jarvis-Windows-Setup.exe SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Jarvis Windows Pilot v2" --prerelease --notes "The screen now says Jarvis. On repeated Windows engine exits the app retries with audio off, so you can type if audio startup was the issue. If the engine still stops, open Settings > Diagnostics and share the last lines of window.log. The installer is unsigned. Close the existing app from the tray before upgrading."
