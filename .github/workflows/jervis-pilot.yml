name: Jarvis Windows master installer
on:
  push:
    branches: [main]
    paths: ['jervis-pilot/build-ready.txt']
  workflow_dispatch:
concurrency:
  group: jarvis-windows-pilot
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Prepare pinned MIT-licensed Jarvis
        shell: pwsh
        run: |
          git init upstream
          git -C upstream fetch --depth 1 https://github.com/TheJarvis-App/jarvis-app.git 7d06964126c02422351fe014b4b736cf4e365a78
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C upstream checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item jervis-pilot/jarvis_pilot.py upstream/
          python jervis-pilot/apply_master.py upstream
          node --check upstream/backend.js
          node --check upstream/renderer.js
          python -m py_compile upstream/app.py
      - name: Build Windows installer
        working-directory: upstream
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          JARVIS_AUDIO: 'off'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -r requirements.txt -r requirements-dev.txt pyinstaller
          python -m pytest -q tests/test_local_ai.py tests/test_nlu.py
          $env:PYTHONPATH = (Resolve-Path ../jervis-pilot).Path
          python ../jervis-pilot/check_pilot.py
          Remove-Item Env:PYTHONPATH
      - name: Package and smoke-test installer
        working-directory: upstream
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          JARVIS_AUDIO: 'off'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python ../jervis-pilot/stage_master.py offline
          Copy-Item LICENSE offline/Jervis-LICENSE.txt
          pyinstaller --noconfirm --distpath backend-dist --workpath build/pyinstaller jarvis-backend.spec
          $env:JARVIS_MASTER_DIR = (Resolve-Path offline).Path
          $env:JARVIS_DATA_DIR = Join-Path $env:RUNNER_TEMP 'Jarvis speech test'
          $env:HF_HUB_OFFLINE = '1'
          $env:JARVIS_STT_LANGUAGE = 'en'
          $env:JARVIS_TEST_SPEECH_WAV = Join-Path $env:RUNNER_TEMP 'jarvis-speech.wav'
          @'
          param()
          $ErrorActionPreference = 'Stop'
            Add-Type -AssemblyName System.Speech
            $synth = New-Object System.Speech.Synthesis.SpeechSynthesizer
            $format = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(16000, [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
            $synth.SetOutputToWaveFile($env:JARVIS_TEST_SPEECH_WAV, $format)
            $synth.Speak("The blue sky is clear today.")
            $synth.Dispose()
          '@ | Set-Content -Encoding UTF8 (Join-Path $env:RUNNER_TEMP 'jarvis-speech.ps1')
          powershell.exe -NoProfile -NonInteractive -File (Join-Path $env:RUNNER_TEMP 'jarvis-speech.ps1')
          & ./backend-dist/jarvis-backend/jarvis-backend.exe --selftest --speech
          Remove-Item Env:JARVIS_MASTER_DIR,Env:JARVIS_DATA_DIR,Env:HF_HUB_OFFLINE,Env:JARVIS_TEST_SPEECH_WAV
          npm ci
          npx electron-builder --win --publish never
          if ((Get-Item 'release/Jarvis Setup.exe').Length -ge 2GB) { throw 'Master installer exceeds the release asset limit.' }
          ./tests/installer/windows_smoke.ps1 -Installer 'release/Jarvis Setup.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Windows-Master
          path: upstream/release/Jarvis Setup.exe
          if-no-files-found: error
      - name: Publish Jarvis Windows update
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd upstream/release
          mv 'Jarvis Setup.exe' Jarvis-Windows-Master-Setup.exe
          sha256sum Jarvis-Windows-Master-Setup.exe > SHA256SUMS.txt
          gh release create jarvis-windows-master-v3 Jarvis-Windows-Master-Setup.exe SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Jarvis Windows Master Installer v3" --prerelease --notes "Faster local conversation on CPU: shorter chat context, concise replies, and direct Ollama routing. Single Windows x64 installer with bundled CPU Ollama, Qwen3 0.6B (thinking disabled), and English Whisper speech recognition. No runtime or model downloads are needed. Close Jarvis from the system tray before upgrading. The installer is unsigned. Voice uses an available Windows system voice. This edition focuses on voice, notes and local text workflows."
